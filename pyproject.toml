[project]
name = "agentsystem"
version = "0.1.0"
description = "企业级 AI 应用落地 PoC —— 订单全生命周期智能问答与任务执行系统"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "sse-starlette>=3.4.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0",
    # 业务侧数据库驱动。checkpointer 另用 psycopg3（见下），项目有两个 PG 驱动
    "asyncpg==0.31.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.0",
    # langgraph-checkpoint-postgres 依赖 psycopg>=3.2，非 asyncpg
    "psycopg[binary,pool]>=3.3.4",
    "httpx>=0.28.0",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
# P0 证据脚本一并排除出 formatter：per-file-ignores 只管 lint，
# formatter 仍会重排，那正是我们要避免的（见 lint 段的说明）。
extend-exclude = [
    "scripts/p0_*.py",
    # ruff 0.16 起会格式化 Markdown 内的 Python 代码块。设计文档里的
    # 代码块是示意与评审留痕，手工折行是为可读性；让格式化器改写它们
    # 会让 `ruff format --check` 因编辑文档而失败。
    "*.md",
]
target-version = "py314"  # 与 .python-version 一致

[tool.ruff.lint]
# D = pydocstyle —— 宪法第十一条「代码必须自带注释」的机械落地物
select = ["E", "F", "I", "UP", "B", "D"]
ignore = [
    "D203",  # 与 D211 冲突，二选一
    "D213",  # 与 D212 冲突，二选一
    # D400/D415 要求首行以句点收尾，但只认 ASCII "."，不认中文句号 "。"。
    # 宪法第十一条要求中文注释，两者直接冲突 —— 关掉标点检查，保留
    # "首行须是一句完整摘要" 的其余约束（D205 等仍生效）。
    "D400",
    "D415",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]              # 测试用例名即文档，不强制 docstring
# Alembic 自动生成；E501 因自动生成的长 DDL 与列注释而放宽
"src/agentsystem/db/migrations/versions/*" = ["D", "E501"]
# P0 阶段的一次性验证脚本，已作为证据归档冻结，不再演进。
# 紧凑写法（分号、单行 if）是当时快速取证的产物，重排会破坏与
# docs/P0-VERIFICATION.md 中引用行号的对应关系。
"scripts/p0_*.py" = ["D", "E501", "E701", "E702", "E741"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsystem"]
